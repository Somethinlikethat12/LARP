<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB FPS Demo</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(8, 10, 18, 0.72);
      --text: #edf3ff;
      --muted: #b7c2d8;
      --accent: #64d2ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#0a1020, #0d172b);
      cursor: crosshair;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(3, 6, 12, 0.7);
      color: var(--text);
      text-align: center;
      user-select: none;
      cursor: pointer;
      z-index: 10;
    }

    #overlay h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.6rem);
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    #overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 700px;
      padding: 0 20px;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      z-index: 9;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 6px rgba(255,255,255,0.9);
    }

    #crosshair::before {
      left: 9px;
      top: 0;
      width: 2px;
      height: 20px;
    }

    #crosshair::after {
      left: 0;
      top: 9px;
      width: 20px;
      height: 2px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="overlay">
      <h1>Click to enter FPS</h1>
      <p>Move: W/S/A/D · Look: Mouse · Swing: M · Throw: N · Exit: Esc</p>
    </div>
    <div id="crosshair"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    if (location.protocol === 'file:') {
      console.warn('GLTF loading is more reliable from a local http server. Try: python3 -m http.server 8000 from the webgl folder, then open http://localhost:8000');
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1220);
    scene.fog = new THREE.Fog(0x0a1220, 32, 150);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(0, 2, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xbfe3ff, 0x202533, 1.25);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(8, 18, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x1c2b38, roughness: 0.9, metalness: 0.15 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(200, 50, 0x5dc0ff, 0x2d4054);
    grid.position.y = 0.01;
    scene.add(grid);

    const overlay = document.getElementById('overlay');
    const keys = {};
    const clock = new THREE.Clock();
    const playerModelUrl = './Tung%20tung%20tung%20Sahur.glb';
    const batModelUrl = './wooden_bat.glb';
    const loader = new THREE.GLTFLoader();
    loader.setCrossOrigin('anonymous');

    let player = null;
    let enemies = [];
    let playerModelTemplate = null;
    let batWeaponTemplate = null;
    let firstPersonWeapon = null;
    let thrownBats = [];
    let yaw = 0;
    let pitch = 0;
    const cameraHeight = 1.6;
    const groundHeight = 1.75;
    const attackState = {
      meleeCooldown: 0,
      throwCooldown: 0,
      meleeSwing: 0
    };

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function scaleModelToHeight(model, targetHeight) {
      const box = new THREE.Box3().setFromObject(model);
      const size = new THREE.Vector3();
      box.getSize(size);
      const currentHeight = size.y || 1;
      const scale = targetHeight / currentHeight;
      model.scale.setScalar(scale);
      return scale;
    }

    function removeShadowPlanes(model) {
      model.traverse((child) => {
        if (!child.isMesh) return;

        const name = (child.name || '').toLowerCase();
        if (name.includes('plane') || name.includes('shadow') || name.includes('foot') || child.geometry?.type === 'PlaneGeometry') {
          child.visible = false;
        }

        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
    }

    function buildPlayerFromTemplate() {
      const mesh = playerModelTemplate.clone(true);
      scaleModelToHeight(mesh, cameraHeight);
      mesh.position.set(0, groundHeight, 0);
      mesh.rotation.y = Math.PI;
      removeShadowPlanes(mesh);
      scene.add(mesh);
      return mesh;
    }

    function spawnEnemy(x, z) {
      const mesh = playerModelTemplate.clone(true);
      scaleModelToHeight(mesh, cameraHeight * 0.9);
      mesh.position.set(x, groundHeight + 0.55, z);
      mesh.rotation.y = 0;
      removeShadowPlanes(mesh);
      scene.add(mesh);
      enemies.push({
        mesh,
        speed: 2.4 + Math.random() * 1.1,
        drift: Math.random() * Math.PI * 2,
      });
    }

    function attachBatWeapon() {
      if (!batWeaponTemplate || firstPersonWeapon) return;

      firstPersonWeapon = batWeaponTemplate.clone(true);
      scaleModelToHeight(firstPersonWeapon, 1.15);
      removeShadowPlanes(firstPersonWeapon);
      firstPersonWeapon.position.set(0.8, -0.78, -1.35);
      firstPersonWeapon.rotation.set(0.8, Math.PI / 2.2, 0.2);
      camera.add(firstPersonWeapon);
    }

    function loadModel() {
      loader.load(
        playerModelUrl,
        (gltf) => {
          const root = gltf.scene;
          removeShadowPlanes(root);

          playerModelTemplate = root;
          player = buildPlayerFromTemplate();
          player.visible = false;

          const spawnPositions = [
            [-12, -8], [14, -4], [-18, 16], [18, 15], [-4, 24], [10, 24]
          ];

          spawnPositions.forEach(([x, z]) => spawnEnemy(x, z));
        },
        undefined,
        (error) => {
          console.error('Character GLTF load failed:', error);
          overlay.innerHTML = '<h1>Model failed to load</h1><p>Check the model path and serve the folder over http instead of opening the file directly.</p>';
        }
      );

      loader.load(
        batModelUrl,
        (gltf) => {
          batWeaponTemplate = gltf.scene;
          removeShadowPlanes(batWeaponTemplate);
          attachBatWeapon();
        },
        undefined,
        (error) => {
          console.error('Bat GLTF load failed:', error);
        }
      );
    }

    function onPointerLockChange() {
      if (document.pointerLockElement === renderer.domElement) {
        overlay.style.display = 'none';
      } else {
        overlay.style.display = 'flex';
      }
    }

    function performMeleeAttack() {
      if (attackState.meleeCooldown > 0) return;
      attackState.meleeCooldown = 0.42;
      attackState.meleeSwing = 0.18;

      const attackDirection = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();

      for (const enemy of enemies) {
        const toEnemy = enemy.mesh.position.clone().sub(camera.position);
        const distance = toEnemy.length();
        if (distance < 3.2) {
          const facing = toEnemy.clone().normalize().dot(attackDirection);
          if (facing > 0.2) {
            enemy.mesh.scale.multiplyScalar(0.96);
            enemy.mesh.position.y += 0.1;
          }
        }
      }
    }

    function spawnThrownBat() {
      if (attackState.throwCooldown > 0 || !batWeaponTemplate) return;
      attackState.throwCooldown = 0.9;

      const projectile = batWeaponTemplate.clone(true);
      removeShadowPlanes(projectile);
      scaleModelToHeight(projectile, 1.0);
      const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
      const start = camera.position.clone().add(dir.clone().multiplyScalar(0.9));
      projectile.position.copy(start);
      projectile.rotation.copy(camera.rotation);
      projectile.rotation.x += 0.8;
      projectile.rotation.z += 0.5;
      scene.add(projectile);
      thrownBats.push({ mesh: projectile, velocity: dir.multiplyScalar(18) });
    }

    function handleMovement(dt) {
      if (!player) return;

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const move = new THREE.Vector3();

      if (keys.KeyW) move.sub(forward);
      if (keys.KeyS) move.add(forward);
      if (keys.KeyA) move.sub(right);
      if (keys.KeyD) move.add(right);

      if (move.lengthSq() > 0) {
        move.normalize();
        player.position.addScaledVector(move, 7.5 * dt);
      }

      player.position.x = clamp(player.position.x, -45, 45);
      player.position.z = clamp(player.position.z, -45, 45);

      player.rotation.y = yaw;
    }

    function updateCamera(dt) {
      if (!player) return;

      camera.position.set(player.position.x, player.position.y + cameraHeight - 0.15, player.position.z);
      camera.rotation.order = 'YXZ';
      camera.rotation.x = pitch;
      camera.rotation.y = yaw;

      if (firstPersonWeapon) {
        firstPersonWeapon.position.set(0.8, -0.78, -1.35);
        firstPersonWeapon.rotation.set(0.8, Math.PI / 2.2, 0.2);
        if (attackState.meleeSwing > 0) {
          firstPersonWeapon.rotation.z = 0.2 + Math.sin((0.18 - attackState.meleeSwing) * 30) * 0.9;
        }
      }
    }

    function updateEnemies(dt) {
      if (!player) return;

      for (const enemy of enemies) {
        const toPlayer = player.position.clone().sub(enemy.mesh.position);
        const horizontal = toPlayer.clone();
        horizontal.y = 0;

        if (horizontal.lengthSq() > 0.001) {
          const yawToPlayer = Math.atan2(horizontal.x, horizontal.z);
          enemy.mesh.rotation.y = yawToPlayer;
          horizontal.normalize();
          enemy.mesh.position.addScaledVector(horizontal, enemy.speed * dt);
        }
      }
    }

    document.addEventListener('keydown', (event) => {
      keys[event.code] = true;
      if (event.code === 'Escape') {
        document.exitPointerLock();
      }
      if (event.code === 'KeyM') {
        performMeleeAttack();
      }
      if (event.code === 'KeyN') {
        spawnThrownBat();
      }
    });

    document.addEventListener('keyup', (event) => {
      keys[event.code] = false;
    });

    document.addEventListener('mousemove', (event) => {
      if (document.pointerLockElement !== renderer.domElement || !player) return;

      yaw -= event.movementX * 0.0025;
      pitch = clamp(pitch - event.movementY * 0.0015, -1.1, 1.1);

      player.rotation.y = yaw;
      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
    });

    renderer.domElement.addEventListener('click', () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener('contextmenu', (event) => {
      event.preventDefault();
    });

    document.addEventListener('pointerlockchange', onPointerLockChange);

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      attackState.meleeCooldown = Math.max(0, attackState.meleeCooldown - dt);
      attackState.throwCooldown = Math.max(0, attackState.throwCooldown - dt);
      attackState.meleeSwing = Math.max(0, attackState.meleeSwing - dt);

      for (let i = thrownBats.length - 1; i >= 0; i--) {
        const projectile = thrownBats[i];
        projectile.mesh.position.addScaledVector(projectile.velocity, dt);
        projectile.mesh.rotation.z += 0.25;

        for (const enemy of enemies) {
          if (projectile.mesh.position.distanceTo(enemy.mesh.position) < 1.8) {
            enemy.mesh.scale.multiplyScalar(0.92);
            scene.remove(projectile.mesh);
            thrownBats.splice(i, 1);
            break;
          }
        }

        if (projectile.mesh.position.length() > 80) {
          scene.remove(projectile.mesh);
          thrownBats.splice(i, 1);
        }
      }

      if (player) {
        handleMovement(dt);
        updateEnemies(dt);
        updateCamera(dt);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadModel();
    animate();
  </script>
</body>
</html>
