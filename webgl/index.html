<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Camera Environment (Perfect Movement)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #1a1a2e;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            perspective: 600px;
            perspective-origin: 50% 50%;
        }

        #instructions {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; background: rgba(0, 0, 0, 0.8);
            cursor: pointer; z-index: 10; text-align: center;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 5;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* Outer frame handles mouse rotation */
        .camera-rotation-rig {
            width: 100%; height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        /* Inner frame handles physical world translation offsets */
        .world-translation-rig {
            width: 100%; height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        /* 3D Floor Grid */
        .floor {
            position: absolute;
            width: 4000px; height: 4000px;
            top: 50%; left: 50%;
            margin-left: -2000px; margin-top: -2000px;
            background-image: 
                linear-gradient(rgba(68, 68, 255, 0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(68, 68, 255, 0.2) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(90deg) translateZ(100px); /* Flips grid plane flat */
        }

        /* 3D Cube Structure */
        .cube {
            position: absolute;
            width: 150px; height: 150px;
            top: 50%; left: 50%;
            margin-left: -75px; margin-top: -75px;
            transform-style: preserve-3d;
            transform: translate3d(0, 0, 0);
        }

        .face {
            position: absolute;
            width: 150px; height: 150px;
            border: 2px solid #fff;
            opacity: 0.9;
        }

        .front  { background: #ff4136; transform: rotateY(  0deg) translateZ(75px); }
        .back   { background: #0074d9; transform: rotateY(180deg) translateZ(75px); }
        .right  { background: #2ecc40; transform: rotateY( 90deg) translateZ(75px); }
        .left   { background: #ffdc00; transform: rotateY(-90deg) translateZ(75px); }
        .top    { background: #b10dc9; transform: rotateX( 90deg) translateZ(75px); }
        .bottom { background: #ff851b; transform: rotateX(-90deg) translateZ(75px); }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Click to Look & Walk Around</h1>
        <p>Move: WASD | Look: Mouse | Exit: ESC</p>
    </div>
    
    <div id="crosshair"></div>

    <!-- Rotations and position translations must happen in separate container matrices -->
    <div class="camera-rotation-rig" id="rotationRig">
        <div class="world-translation-rig" id="translationRig">
            <div class="floor"></div>
            <div class="cube">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </div>
    </div>

    <script>
        const rotationRig = document.getElementById('rotationRig');
        const translationRig = document.getElementById('translationRig');
        const instructions = document.getElementById('instructions');

        // State trackers
        let keys = { w: false, a: false, s: false, d: false };
        let camX = 0, camY = 100, camZ = -400; // Physical position vector coordinates
        let rotX = 0, rotY = 0;                 // Viewing angle adjustments
        const speed = 6;

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            instructions.style.display = (document.pointerLockElement === document.body) ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            rotY -= e.movementX * 0.15; // Left-Right rotation
            rotX += e.movementY * 0.15; // Up-Down rotation
            rotX = Math.max(-75, Math.min(75, rotX)); // Keep looking pitch within safe vertical boundaries
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        function updateScene() {
            if (document.pointerLockElement === document.body) {
                // Convert current viewing angle into horizontal trigonometry radians
                let angleRad = rotY * Math.PI / 180;

                // Calculate direction vectors relative to current view angle
                let sin = Math.sin(angleRad);
                let cos = Math.cos(angleRad);

                if (keys.w) {
                    camX += sin * speed;
                    camZ += cos * speed;
                }
                if (keys.s) {
                    camX -= sin * speed;
                    camZ -= cos * speed;
                }
                if (keys.a) {
                    camX += cos * speed;
                    camZ -= sin * speed;
                }
                if (keys.d) {
                    camX -= cos * speed;
                    camZ += sin * speed;
                }
            }

            // 1. Rotate the camera viewing frame first to track the mouse look direction
            rotationRig.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            // 2. Shift the inner world contents in reverse to mimic actual position stepping
            translationRig.style.transform = `translate3d(${-camX}px, ${camY}px, ${camZ}px)`;
            
            requestAnimationFrame(updateScene);
        }

        updateScene();
    </script>
</body>
</html>
