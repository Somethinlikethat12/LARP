<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Camera Environment (Directional Movement)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #1a1a2e;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            perspective: 600px; /* Lens depth of the camera view */
            perspective-origin: 50% 50%;
        }

        #instructions {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(0, 0, 0, 0.8);
            cursor: pointer;
            z-index: 10;
            text-align: center;
        }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* Outer camera frame to handle movement position offsets */
        .camera-rig {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: translate3d(0, 0, 0);
        }

        /* Inner world container to handle mouse rotation offsets separately */
        .world-container {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(0deg) rotateY(0deg);
        }

        /* 3D Floor Grid */
        .floor {
            position: absolute;
            width: 4000px;
            height: 4000px;
            top: 50%; left: 50%;
            margin-left: -2000px; margin-top: -2000px;
            background-image: 
                linear-gradient(rgba(68, 68, 255, 0.2) 2px, transparent 2px),
                linear-gradient(90deg, rgba(68, 68, 255, 0.2) 2px, transparent 2px);
            background-size: 50px 50px;
            transform: rotateX(90deg) translateZ(75px); /* Flips plane flat on floor */
        }

        /* The 3D Cube Structures */
        .cube {
            position: absolute;
            width: 150px;
            height: 150px;
            top: 50%; left: 50%;
            margin-left: -75px; margin-top: -75px;
            transform-style: preserve-3d;
            transform: translate3d(0, 0, 0);
        }

        .face {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid #fff;
            opacity: 0.9;
        }

        .front  { background: #ff4136; transform: rotateY(  0deg) translateZ(75px); }
        .back   { background: #0074d9; transform: rotateY(180deg) translateZ(75px); }
        .right  { background: #2ecc40; transform: rotateY( 90deg) translateZ(75px); }
        .left   { background: #ffdc00; transform: rotateY(-90deg) translateZ(75px); }
        .top    { background: #b10dc9; transform: rotateX( 90deg) translateZ(75px); }
        .bottom { background: #ff851b; transform: rotateX(-90deg) translateZ(75px); }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Click to Look & Walk Around</h1>
        <p>Move: WASD | Look: Mouse | Exit: ESC</p>
    </div>
    
    <div id="crosshair"></div>

    <!-- Separating position variables from rotation variables enables relative vector movements -->
    <div class="camera-rig" id="rig">
        <div class="world-container" id="world">
            <div class="floor"></div>
            <div class="cube">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>
        </div>
    </div>

    <script>
        const rig = document.getElementById('rig');
        const world = document.getElementById('world');
        const instructions = document.getElementById('instructions');

        // State Trackers
        let keys = { w: false, a: false, s: false, d: false };
        let camX = 0, camY = 0, camZ = -400; // Camera spatial coordinates
        let rotX = 0, rotY = 0;               // Camera look variables
        const speed = 5;

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            instructions.style.display = (document.pointerLockElement === document.body) ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            rotY -= e.movementX * 0.15; // Pan left/right
            rotX += e.movementY * 0.15; // Tilt up/down
            rotX = Math.max(-70, Math.min(70, rotX)); // Bound view pitch tracking
        });

        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        function updateScene() {
            if (document.pointerLockElement === document.body) {
                // Convert your yaw/heading degrees into radians for vector tracking
                let angleRad = rotY * Math.PI / 180;

                // Track forward/backward facing vectors using circular trigonometry
                let forwardX = Math.sin(angleRad);
                let forwardZ = Math.cos(angleRad);

                // Track sideways/strafe orientation vectors (perpendicular offset vectors)
                let rightX = Math.cos(angleRad);
                let rightZ = -Math.sin(angleRad);

                if (keys.w) {
                    camX += forwardX * speed;
                    camZ += forwardZ * speed;
                }
                if (keys.s) {
                    camX -= forwardX * speed;
                    camZ -= forwardZ * speed;
                }
                if (keys.a) {
                    camX -= rightX * speed;
                    camZ -= rightZ * speed;
                }
                if (keys.d) {
                    camX += rightX * speed;
                    camZ += rightZ * speed;
                }
            }

            // Apply rotation matrices over the world layer first
            world.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            // Translate space coordinates safely on the parent position rig layer
            rig.style.transform = `translate3d(${-camX}px, ${-camY}px, ${camZ}px)`;
            
            requestAnimationFrame(updateScene);
        }

        updateScene();
    </script>
</body>
</html>
