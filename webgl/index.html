<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB FPS Demo</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: rgba(8, 10, 18, 0.72);
      --text: #edf3ff;
      --muted: #b7c2d8;
      --accent: #64d2ff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: linear-gradient(#0a1020, #0d172b);
      cursor: crosshair;
    }

    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 12px;
      background: rgba(3, 6, 12, 0.7);
      color: var(--text);
      text-align: center;
      user-select: none;
      cursor: pointer;
      z-index: 10;
    }

    #overlay h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.6rem);
      letter-spacing: 0.05em;
      font-weight: 700;
    }

    #overlay p {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.6;
      max-width: 700px;
      padding: 0 20px;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translate(-50%, -50%);
      z-index: 9;
      pointer-events: none;
    }

    #crosshair::before,
    #crosshair::after {
      content: "";
      position: absolute;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 6px rgba(255,255,255,0.9);
    }

    #crosshair::before {
      left: 9px;
      top: 0;
      width: 2px;
      height: 20px;
    }

    #crosshair::after {
      left: 0;
      top: 9px;
      width: 20px;
      height: 2px;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div id="overlay">
      <h1>Click to enter FPS</h1>
      <p>Move: WASD · Look: Mouse · Jump: Space · Exit: Esc</p>
    </div>
    <div id="crosshair"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

  <script>
    if (location.protocol === 'file:') {
      console.warn('GLTF loading is more reliable from a local http server. Try: python3 -m http.server 8000 from the webgl folder, then open http://localhost:8000');
    }

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a1220);
    scene.fog = new THREE.Fog(0x0a1220, 32, 150);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 4000);
    camera.position.set(0, 2, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xbfe3ff, 0x202533, 1.25);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(8, 18, 10);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    sun.shadow.camera.left = -50;
    sun.shadow.camera.right = 50;
    sun.shadow.camera.top = 50;
    sun.shadow.camera.bottom = -50;
    scene.add(sun);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(200, 200),
      new THREE.MeshStandardMaterial({ color: 0x1c2b38, roughness: 0.9, metalness: 0.15 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    const grid = new THREE.GridHelper(200, 50, 0x5dc0ff, 0x2d4054);
    grid.position.y = 0.01;
    scene.add(grid);

    const overlay = document.getElementById('overlay');
    const keys = {};
    const clock = new THREE.Clock();
    const batModelUrl = './wooden_bat.glb';
    const batProjectileModelUrl = './wooden_bat.glb';
    const modelUrl = batModelUrl;
    const loader = new THREE.GLTFLoader();
    loader.setCrossOrigin('anonymous');

    let player = null;
    let enemies = [];
    let playerModelTemplate = null;

    function clamp(value, min, max) {
      return Math.min(max, Math.max(min, value));
    }

    function buildPlayerFromTemplate() {
      const mesh = playerModelTemplate.clone(true);
      mesh.scale.setScalar(0.9);
      mesh.position.set(0, 0.116, 0);
      mesh.rotation.y = Math.PI;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(mesh);
      return mesh;
    }

    function spawnEnemy(x, z) {
      const mesh = playerModelTemplate.clone(true);
      mesh.scale.setScalar(0.7);
      mesh.position.set(x, 0.1, z);
      mesh.rotation.y = 0;
      mesh.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(mesh);
      enemies.push({
        mesh,
        speed: 2.4 + Math.random() * 1.1,
        drift: Math.random() * Math.PI * 2,
      });
    }

    function loadModel() {
      loader.load(
        modelUrl,
        (gltf) => {
          const root = gltf.scene;
          root.traverse((child) => {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });

          playerModelTemplate = root;
          player = buildPlayerFromTemplate();

          const spawnPositions = [
            [-12, -8], [14, -4], [-18, 16], [18, 15], [-4, 24], [10, 24]
          ];

          spawnPositions.forEach(([x, z]) => spawnEnemy(x, z));
        },
        undefined,
        (error) => {
          console.error('GLTF load failed:', error);
          overlay.innerHTML = '<h1>Model failed to load</h1><p>Check the model path and serve the folder over http instead of opening the file directly.</p>';
        }
      );
    }

    function onPointerLockChange() {
      if (document.pointerLockElement === renderer.domElement) {
        overlay.style.display = 'none';
      } else {
        overlay.style.display = 'flex';
      }
    }

    function handleMovement(dt) {
      if (!player) return;

      const forward = new THREE.Vector3(Math.sin(player.rotation.y), 0, Math.cos(player.rotation.y));
      const right = new THREE.Vector3(forward.z, 0, -forward.x);
      const move = new THREE.Vector3();

      if (keys.KeyW) move.add(forward);
      if (keys.KeyS) move.sub(forward);
      if (keys.KeyA) move.sub(right);
      if (keys.KeyD) move.add(right);

      if (move.lengthSq() > 0) {
        move.normalize();
        player.position.addScaledVector(move, 7.5 * dt);
      }

      player.position.x = clamp(player.position.x, -45, 45);
      player.position.z = clamp(player.position.z, -45, 45);

      player.rotation.y = Math.atan2(camera.rotation.y, 0);
    }

    function updateCamera(dt) {
      if (!player) return;

      const lookTarget = player.position.clone().add(new THREE.Vector3(0, 1.6, 0));
      const behind = new THREE.Vector3(-Math.sin(player.rotation.y), 0, -Math.cos(player.rotation.y));
      const desiredCamPos = lookTarget.clone().add(behind.multiplyScalar(7)).add(new THREE.Vector3(0, 2.2, 0));

      camera.position.lerp(desiredCamPos, 1 - Math.pow(0.01, dt));
      camera.lookAt(lookTarget);
    }

    function updateEnemies(dt) {
      if (!player) return;

      for (const enemy of enemies) {
        const dir = player.position.clone().sub(enemy.mesh.position);
        dir.y = 0;
        if (dir.lengthSq() > 0.001) {
          dir.normalize();
          enemy.mesh.position.addScaledVector(dir, enemy.speed * dt);
          enemy.mesh.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.2, 0)));
        }
      }
    }

    document.addEventListener('keydown', (event) => {
      keys[event.code] = true;
      if (event.code === 'Escape') {
        document.exitPointerLock();
      }
    });

    document.addEventListener('keyup', (event) => {
      keys[event.code] = false;
    });

    document.addEventListener('mousemove', (event) => {
      if (document.pointerLockElement !== renderer.domElement || !player) return;

      player.rotation.y -= event.movementX * 0.0025;
      player.rotation.x = clamp(player.rotation.x - event.movementY * 0.0015, -1.1, 1.1);
      camera.rotation.order = 'YXZ';
      camera.rotation.y = player.rotation.y;
      camera.rotation.x = player.rotation.x;
    });

    renderer.domElement.addEventListener('click', () => {
      renderer.domElement.requestPointerLock();
    });

    document.addEventListener('pointerlockchange', onPointerLockChange);

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      if (player) {
        handleMovement(dt);
        updateEnemies(dt);
        updateCamera(dt);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    loadModel();
    animate();
  </script>
</body>
</html>
