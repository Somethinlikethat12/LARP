<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Platformer with Gravity</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: #0b0b16;
            height: 100vh;
            overflow: hidden;
            font-family: sans-serif;
            perspective: 600px;
            perspective-origin: 50% 50%;
        }

        #instructions {
            position: absolute;
            width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: white; background: rgba(0, 0, 0, 0.85);
            cursor: pointer; z-index: 10; text-align: center;
        }

        h1 { margin-bottom: 10px; font-size: 2rem; }
        p { color: #aaa; line-height: 1.6; }

        #crosshair {
            position: absolute;
            top: 50%; left: 50%;
            width: 10px; height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none; z-index: 5;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: white; }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        /* Outer frame handles mouse rotation look variables */
        .camera-rotation-rig {
            width: 100%; height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        /* Inner frame handles physical camera positional translations */
        .world-translation-rig {
            width: 100%; height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        /* The Main 3D Floating Platform Stage */
        .platform {
            position: absolute;
            width: 1200px; height: 1200px;
            top: 50%; left: 50%;
            margin-left: -600px; margin-top: -600px;
            transform-style: preserve-3d;
            transform: translate3d(0, 0, 0);
        }

        .p-face {
            position: absolute;
            border: 4px solid #4444ff;
        }
        /* Top surface of the platform you walk on */
        .p-top    { width: 1200px; height: 1200px; background: #1a1a3a; transform: rotateX(90deg) translateZ(0px); }
        /* Thick side borders to give it a block structure */
        .p-front  { width: 1200px; height: 40px; background: #4b5153; transform: rotateX(0deg) translateZ(600px) translateY(0px); }
        .p-back   { width: 1200px; height: 40px; background: #4b5153; transform: rotateX(180deg) translateZ(600px) translateY(-40px); }
        .p-right  { width: 1200px; height: 40px; background: #4b5153; transform: rotateY(90deg) translateZ(600px) translateY(0px); }
        .p-left   { width: 1200px; height: 40px; background: #4b5153; transform: rotateY(-90deg) translateZ(600px) translateY(0px); }

        /* The Center Obstacle Cube */
        .cube {
            position: absolute;
            width: 150px; height: 150px;
            top: 50%; left: 50%;
            margin-left: -75px; margin-top: -75px;
            transform-style: preserve-3d;
            transform: translate3d(0, -75px, 0); /* Raised so it sits flat on the platform */
        }

        .face {
            position: absolute;
            width: 150px; height: 150px;
            border: 2px solid #fff;
            opacity: 0.9;
        }

        .front  { background: #ff4136; transform: rotateY(  0deg) translateZ(75px); }
        .back   { background: #0074d9; transform: rotateY(180deg) translateZ(75px); }
        .right  { background: #2ecc40; transform: rotateY( 90deg) translateZ(75px); }
        .left   { background: #ffdc00; transform: rotateY(-90deg) translateZ(75px); }
        .top    { background: #b10dc9; transform: rotateX( 90deg) translateZ(75px); }
        .bottom { background: #ff851b; transform: rotateX(-90deg) translateZ(75px); }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Click to Explore the Platform</h1>
        <p>Move: WASD | Look: Mouse<br>Jump: SPACEBAR | Exit: ESC</p>
    </div>
    
    <div id="crosshair"></div>

    <div class="camera-rotation-rig" id="rotationRig">
        <div class="world-translation-rig" id="translationRig">
            
            <!-- Floating Platform Stage Container -->
            <div class="platform">
                <div class="p-face p-top"></div>
                <div class="p-face p-front"></div>
                <div class="p-face p-back"></div>
                <div class="p-face p-right"></div>
                <div class="p-face p-left"></div>
            </div>

            <!-- Central Target Cube -->
            <div class="cube">
                <div class="face front"></div>
                <div class="face back"></div>
                <div class="face right"></div>
                <div class="face left"></div>
                <div class="face top"></div>
                <div class="face bottom"></div>
            </div>

        </div>
    </div>

    <script>
        const rotationRig = document.getElementById('rotationRig');
        const translationRig = document.getElementById('translationRig');
        const instructions = document.getElementById('instructions');

        // Input Trackers
        let keys = { w: false, a: false, s: false, d: false, space: false };
        
        // Camera Spatial Vectors
        let camX = 0;
        let camY = 120; // Standing eye-height relative to the platform plane (0)
        let camZ = -400;
        
        let rotX = 0;
        let rotY = 0;

        // Physics Constants
        let velocityY = 0;
        const gravity = 0.4;
        const jumpForce = 9;
        const floorHeight = 120; // Default standing position above y=0 platform plane
        let isGrounded = true;
        let accel = 1;
        let velocityX = 0;

        const speed = 7;

        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            instructions.style.display = (document.pointerLockElement === document.body) ? 'none' : 'flex';
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;
            
            rotY -= e.movementX * 0.15;
            rotX += e.movementY * 0.15;
            rotX = Math.max(-75, Math.min(75, rotX));
        });

        document.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = true;
            if (e.code === 'Space') {
                keys.space = true;
                e.preventDefault(); // Stop screen from scrolling down
            }
        });

        document.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in keys) keys[key] = false;
            if (e.code === 'Space') keys.space = false;
        });

        function updateScene() {
            let prevel= velocityX;
            if (document.pointerLockElement === document.body) {
                // --- 1. HORIZONTAL CAMERA TRANSLATION ---
                let angleRad = rotY * Math.PI / 180;
                let sin = Math.sin(angleRad);
                let cos = Math.cos(angleRad);

                if (keys.w) { velocityX=(speed*accel); camX += sin * velocityX; camZ += cos * velocityX; accel = accel*1.01}
                if (keys.s) { camX -= sin * speed; camZ -= cos * speed; }
                if (keys.a) { camX += cos * speed; camZ -= sin * speed; }
                if (keys.d) { camX -= cos * speed; camZ += sin * speed; }
                
                // --- 2. VERTICAL JUMP PHYSICS & GRAVITY ---
                if (keys.space && isGrounded) {
                    velocityY = jumpForce;
                    isGrounded = false;
                }

                // If in mid-air, apply gravity pull
                if (!isGrounded) {
                    velocityY -= gravity;
                    camY += velocityY; // Positive velocity pushes camera higher up

                    // Land back down check
                    if (camY <= floorHeight) {
                        camY = floorHeight;
                        velocityY = 0;
                        isGrounded = true;
                    }
                }
            }

            // --- 3. RENDER ENVIRONMENT TRANSFORMS ---
            rotationRig.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg)`;
            
            // CSS matrices use an inverted coordinate axis system for translations
            translationRig.style.transform = `translate3d(${-camX}px, ${camY}px, ${camZ}px)`;
            if(prevel==velocityX)
            velocityX=0;
            requestAnimationFrame(updateScene);
        }

        updateScene();
    </script>
</body>
</html>
