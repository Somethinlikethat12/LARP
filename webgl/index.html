<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Scene with FPS Camera</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: sans-serif;
        }

        /* Overlay prompting the user to activate look mode */
        #instructions {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(0, 0, 0, 0.75);
            cursor: pointer;
            z-index: 10;
            text-align: center;
        }

        h1 { margin-bottom: 10px; font-size: 2rem; }
        p { color: #aaa; }

        /* Reticle centered on your viewport */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Click to Look Around</h1>
        <p>Move: WASD | Look: Mouse | Exit: ESC</p>
    </div>
    
    <div id="crosshair"></div>

    <!-- Include Three.js via CDN -->
    <script src="https://cloudflare.com"></script>

    <script>
        // --- 1. SETUP ENGINE SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        // Start the camera back and slightly up so you can see the cube instantly
        camera.position.set(0, 2, 8); 

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.7);
        directionalLight.position.set(5, 10, 7);
        scene.add(directionalLight);

        // Grid floor reference layout
        const grid = new THREE.GridHelper(100, 40, 0x4444ff, 0x333333);
        scene.add(grid);

        // --- 3. THE CUBE (Stationary) ---
        // Creating distinct colored face materials just like your original CSS styling
        const materials = [
            new THREE.MeshStandardMaterial({ color: 0x2ecc40 }), // Right (Green)
            new THREE.MeshStandardMaterial({ color: 0xffdc00 }), // Left (Yellow)
            new THREE.MeshStandardMaterial({ color: 0xb10dc9 }), // Top (Purple)
            new THREE.MeshStandardMaterial({ color: 0xff851b }), // Bottom (Orange)
            new THREE.MeshStandardMaterial({ color: 0xff4136 }), // Front (Red)
            new THREE.MeshStandardMaterial({ color: 0x0074d9 })  // Back (Blue)
        ];

        const geometry = new THREE.BoxGeometry(3, 3, 3);
        const centralCube = new THREE.Mesh(geometry, materials);
        centralCube.position.set(0, 1.5, 0); // Positioned flat on the grid floor
        scene.add(centralCube);

        // --- 4. CONTROLS STATE & LOGIC ---
        const keys = { w: false, a: false, s: false, d: false };
        const moveSpeed = 0.12;
        let yaw = 0;   // Left-right viewing angle
        let pitch = 0; // Up-down viewing angle

        const instructions = document.getElementById('instructions');

        // Capture mouse lock execution context
        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                instructions.style.display = 'none';
            } else {
                instructions.style.display = 'flex';
            }
        });

        // Track Pointer Orientation Vectors
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;

            const sensitivity = 0.0025;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;

            // Prevent rolling completely upside down upside down
            pitch = Math.max(-Math.PI / 2.05, Math.min(Math.PI / 2.05, pitch));

            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        // Track Key Triggers
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        // --- 5. SYSTEM RENDER ANIMATION TICK ---
        function animate() {
            requestAnimationFrame(animate);

            if (document.pointerLockElement === document.body) {
                // Compute look and strafe vector transforms matching current head orientation
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

                // Lock translations to the plane of the floor (prevents flying when looking into space)
                forward.y = 0;
                right.y = 0;
                forward.normalize();
                right.normalize();

                if (keys.w) camera.position.addScaledVector(forward, moveSpeed);
                if (keys.s) camera.position.addScaledVector(forward, -moveSpeed);
                if (keys.d) camera.position.addScaledVector(right, moveSpeed);
                if (keys.a) camera.position.addScaledVector(right, -moveSpeed);
            }

            renderer.render(scene, camera);
        }

        // Adjust aspect ratio automatically on window adjustment
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
