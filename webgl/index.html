<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPS Camera (WASD + Mouse)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* Overlay text asking user to click */
        #instructions {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            cursor: pointer;
            z-index: 10;
            text-align: center;
        }

        h1 { margin-bottom: 10px; font-size: 2rem; }
        p { color: #aaa; }

        /* Crosshair in the center of screen */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 5;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: white;
        }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }
    </style>
</head>
<body>

    <div id="instructions">
        <h1>Click to Look Around</h1>
        <p>Move: WASD | Look: Mouse | Exit: ESC</p>
    </div>
    
    <div id="crosshair"></div>

    <!-- Include Three.js library -->
    <script src="https://cloudflare.com"></script>

    <script>
        // --- 1. SETUP THE 3D SCENE ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.FogExp2(0x1a1a2e, 0.05);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.y = 2; // Set camera at human eye-level

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. ADD LIGHTS & ENVIRONMENT ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);

        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
        directionalLight.position.set(10, 20, 10);
        scene.add(directionalLight);

        // Grid Floor
        const grid = new THREE.GridHelper(200, 50, 0x4444ff, 0x444444);
        scene.add(grid);

        // Scatter random colorful cubes to give depth to movement
        for (let i = 0; i < 50; i++) {
            const geometry = new THREE.BoxGeometry(2, Math.random() * 5 + 1, 2);
            const material = new THREE.MeshStandardMaterial({ 
                color: Math.random() * 0xffffff,
                roughness: 0.4 
            });
            const cube = new THREE.Mesh(geometry, material);
            
            cube.position.x = (Math.random() - 0.5) * 80;
            cube.position.z = (Math.random() - 0.5) * 80;
            cube.position.y = geometry.parameters.height / 2; // Sit on floor
            scene.add(cube);
        }

        // --- 3. CONTROLS STATE ---
        const keys = { w: false, a: false, s: false, d: false };
        let moveSpeed = 0.15;
        
        // Rotation trackers
        let yaw = 0;   // Left / Right look
        let pitch = 0; // Up / Down look

        const instructions = document.getElementById('instructions');

        // --- 4. POINTER LOCK & MOUSE LOOK ---
        instructions.addEventListener('click', () => {
            document.body.requestPointerLock();
        });

        document.addEventListener('pointerlockchange', () => {
            if (document.pointerLockElement === document.body) {
                instructions.style.display = 'none';
            } else {
                instructions.style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement !== document.body) return;

            // Sensitivity factor
            const sensitivity = 0.002;
            yaw -= e.movementX * sensitivity;
            pitch -= e.movementY * sensitivity;

            // Clamp vertical looking so you don't flip upside down
            pitch = Math.max(-Math.PI / 2.1, Math.min(Math.PI / 2.1, pitch));

            // Apply Euler rotations directly to camera
            camera.quaternion.setFromEuler(new THREE.Euler(pitch, yaw, 0, 'YXZ'));
        });

        // --- 5. KEYBOARD INPUT ---
        document.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = true;
        });

        document.addEventListener('keyup', (e) => {
            if (e.key.toLowerCase() in keys) keys[e.key.toLowerCase()] = false;
        });

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (document.pointerLockElement === document.body) {
                // Determine forward/backward and sideways vector directions
                const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
                const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);

                // Project movements directly onto the flat floor plane (ignore flying up/down)
                forward.y = 0;
                right.y = 0;
                forward.normalize();
                right.normalize();

                // Apply WASD velocity vector
                if (keys.w) camera.position.addScaledVector(forward, moveSpeed);
                if (keys.s) camera.position.addScaledVector(forward, -moveSpeed);
                if (keys.d) camera.position.addScaledVector(right, moveSpeed);
                if (keys.a) camera.position.addScaledVector(right, -moveSpeed);
            }

            renderer.render(scene, camera);
        }

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
