<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ronin's Path</title>
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; outline: none; }
        #menu {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at center, #2a1a16 0%, #0b0807 75%);
            font-family: Georgia, 'Times New Roman', serif; color: #eadfcf;
        }
        #menu[hidden], #menu .panel[hidden] { display: none; }
        #menu .panel { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(460px, 90vw); text-align: center; max-height: 96vh; overflow-y: auto; }
        #menu h1 { margin: 0; font-size: 58px; color: #e03c32; letter-spacing: 2px; text-shadow: 3px 3px 0 #000; }
        #menu h2 { margin: 0 0 6px; font-size: 32px; color: #e03c32; }
        #menu .kanji { font-size: 30px; color: #c9b48f; margin-bottom: 18px; font-family: 'Yu Mincho', 'MS Mincho', 'Noto Serif JP', serif; }
        #menu p { margin: 0; color: #c9bba5; font-size: 15px; line-height: 1.45; }
        #menu button {
            width: 100%; padding: 13px 18px; font: bold 19px Georgia, serif; color: #f4e9d8; cursor: pointer;
            background: linear-gradient(#5a1f1b, #3a1412); border: 1px solid #a7533f; border-radius: 4px;
        }
        #menu button:hover:not(:disabled) { background: linear-gradient(#7a2922, #4d1915); border-color: #e0a15f; }
        #menu button:disabled { opacity: 0.45; cursor: default; }
        #menu button.back { background: transparent; border-color: #5d4a3c; font-size: 16px; width: auto; padding: 8px 26px; }
        #menu input {
            width: 100%; box-sizing: border-box; padding: 11px; font: 17px monospace; text-align: center; color: #f4e9d8;
            background: #1a1210; border: 1px solid #6b5443; border-radius: 4px;
        }
        #menu .code { font: bold 44px monospace; letter-spacing: 6px; color: #ffd98c; }
        #menu .status { min-height: 42px; }
        #menu .status.bad { color: #ff8a70; }
        #menu .note { font-size: 13px; color: #8f806e; }
        #menu .settings { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; width: 100%; text-align: left; }
        #menu .settings label { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: #c9bba5; }
        #menu select {
            padding: 7px; font: 15px Georgia, serif; color: #f4e9d8; background: #1a1210; border: 1px solid #6b5443; border-radius: 4px;
        }
        #menu select:disabled { opacity: 0.5; }
        #menu .players { font-weight: bold; color: #ffd98c; }
    </style>
</head>
<body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="menu">
        <div class="panel" id="menu-main" hidden>
            <h1>RONIN'S PATH</h1>
            <div class="kanji">浪人の道</div>
            <button id="btn-journey">Begin Journey</button>
            <button id="btn-host">Host Online Match</button>
            <button id="btn-join">Join Online Match</button>
            <p class="note">Host a 1v1 duel or a free-for-all for up to 8 swordsmen. Everyone fights with identical stats and techniques - only skill decides.</p>
        </div>
        <div class="panel" id="menu-host" hidden>
            <h2>Host a Match</h2>
            <div class="settings">
                <label>Mode
                    <select id="set-mode">
                        <option value="duel">1v1 Duel</option>
                        <option value="ffa">Free-for-all</option>
                    </select>
                </label>
                <label>Max players
                    <select id="set-max">
                        <option>2</option><option>3</option><option>4</option><option>5</option>
                        <option>6</option><option>7</option><option selected>8</option>
                    </select>
                </label>
                <label>Rounds to win
                    <select id="set-rounds">
                        <option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option>
                    </select>
                </label>
                <label>Health
                    <select id="set-hp">
                        <option>50</option><option>75</option><option selected>100</option><option>150</option><option>200</option>
                    </select>
                </label>
                <label>Healing gourds
                    <select id="set-gourds">
                        <option>0</option><option selected>1</option><option>2</option><option>3</option>
                    </select>
                </label>
                <label>Arena
                    <select id="set-arena">
                        <option value="small">Small</option>
                        <option value="medium" selected>Medium</option>
                        <option value="large">Large</option>
                        <option value="huge">Huge</option>
                    </select>
                </label>
                <label>Hold-to-stab
                    <select id="set-stab">
                        <option value="on">Allowed</option>
                        <option value="off">Disabled</option>
                    </select>
                </label>
            </div>
            <p>Room code</p>
            <div class="code" id="host-code">------</div>
            <input id="host-link" readonly placeholder="Invite link">
            <button id="btn-copy" disabled>Copy Invite Link</button>
            <p class="players" id="host-players"></p>
            <button id="btn-start" disabled>Start Match</button>
            <p class="status" id="host-status"></p>
            <button class="back">Back</button>
        </div>
        <div class="panel" id="menu-join" hidden>
            <h2>Join a Match</h2>
            <p>Enter the room code from your host, or open their invite link.</p>
            <input id="join-code" maxlength="24" placeholder="ROOM CODE" autocomplete="off" spellcheck="false">
            <button id="btn-join-go">Join</button>
            <p class="status" id="join-status"></p>
            <p class="note" id="join-lobby"></p>
            <button class="back">Back</button>
        </div>
    </div>
    <script src="js/util.js"></script>
    <script src="js/sfx.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/world.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/skills.js"></script>
    <script src="js/loadout.js"></script>
    <script src="js/player.js"></script>
    <script src="js/save.js"></script>
    <script src="js/game.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <script src="js/net.js"></script>
    <script src="js/duel.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
