<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tung Tung Last Stand</title>
    <link rel="stylesheet" href="css.css" />
  </head>
  <body>
    <div id="game-shell">
      <header id="hud">
        <div class="stat-block">
          <span class="label">HP</span>
          <strong id="hp-value">100</strong>
        </div>
        <div class="stat-block">
          <span class="label">Score</span>
          <strong id="score-value">0</strong>
        </div>
        <div class="stat-block">
          <span class="label">Wave</span>
          <strong id="wave-value">1</strong>
        </div>
        <div class="stat-block">
          <span class="label">Ability</span>
          <strong id="ability-value">Ready</strong>
        </div>
        <div class="stat-block best">
          <span class="label">Best</span>
          <strong id="best-value">0</strong>
        </div>
      </header>

      <main id="arena" aria-label="Game arena">
        <div id="player" aria-label="Player"></div>
        <div id="overlay" class="visible">
          <div class="panel">
            <p class="eyebrow">Tung Tung</p>
            <h1 id="overlay-title">Last Stand</h1>
            <p id="overlay-copy">
              Use WASD to move, Space to fire a ranged tung blast, Shift to dash, E to heal for 25 HP, and R to retry.
            </p>
            <button id="start-button" type="button">Start Run</button>
          </div>
        </div>
      </main>
    </div>

    <script src="Game.js"></script>
  </body>
</html>
